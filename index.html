<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rating Website</title>
<link rel="stylesheet" href="stylesheet.css">
</head>

<body id="homepage_BODY">

<!-- NAVIGATION -->
<div class="navbar" id="homepage_NAVBAR">
    <div class="logo" id="homepage_LOGO">MY RATINGS</div>
    <div class="links">
        <a href="show.html" id="homepage_SHOWS_LINK">Shows</a>
        <a href="movies.html" id="homepage_MOVIES_LINK">Movies</a>
        <button id="themeToggle" aria-label="Toggle light/dark mode">
  Light / Dark
</button>
    </div>
</div>

<!-- HEADER -->
<div class="header" id="homepage_HEADER">
    <h1 id="homepage_MAIN_TITLE">Pick a platform to explore your ratings</h1>
    <br>
    <p id="homepage_SUBTITLE">Which platform will you explore today?</p>
    
</div>

<!-- GRID -->
<div class="grid" id="homepage_GRID">

    <a class="card" id="card_NETFLIX" href="NETFLIX shows.html">
        <img src="Assets/Netflixs.png">
    </a>

    <a class="card" id="card_CRUNCHYROLL" href="Crunchyroll shows.html">
        <img src="Assets/crunchyroll.png">
    </a>

    <a class="card" id="card_PRIMEVIDEO" href="PRIME shows.html">
        <img src="Assets/prime video.webp">
    </a>

    <a class="card" id="card_APPLE_TV" href="APPLE TV shows.html">
        <img src="Assets/apple tv.png">
    </a>

    <a class="card" id="card_OSN" href="OSN shows.html">
        <img src="Assets/osn.jpg">
    </a>

    <a class="card" id="card_CINEMA" href="Cinema.html">
        <img src="Assets/cinema.jpg">
    </a>

    <a class="card" id="card_others" href="Others Shows.html">
        <img src="Assets/others.png">
    </a>

  <script>
  (function () {
    const body = document.body;
    const toggle = document.getElementById('themeToggle');
    if (!toggle) return;

    // Load saved preference
    const saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') {
      body.setAttribute('data-theme', saved);
    } else {
      const prefersDark = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;
      body.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    }

    function updateLabel() {
      const current = body.getAttribute('data-theme');
      toggle.textContent = current === 'light' ? 'Dark Mode' : 'Light Mode';
    }
    updateLabel();

    toggle.addEventListener('click', () => {
      const current = body.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      body.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateLabel();
    });
  })();
</script>

</div>

</body>
</html>
