<script>
  // Build flip cards
  document.querySelectorAll(".netflixCard").forEach(card => {
    const originalImg = card.querySelector("img");
    if (!originalImg) return;

    const isMoviesPage = document.body.id === "Movies-body";

    const title       = card.dataset.title       || (isMoviesPage ? "Movie" : "Show");
    const genre       = card.dataset.genre       || (isMoviesPage ? "Movie" : "Show");
    const ratingRaw   = Number(card.dataset.rating || 0);
    const rating      = Math.max(0, Math.min(10, ratingRaw));
    const description = card.dataset.description ||
      (isMoviesPage
        ? "A selected movie from your personal ratings collection."
        : "A selected show from your personal ratings collection.");
    const platform    = card.dataset.platform    || "Mixed Platforms";

    const imageSrc = originalImg.getAttribute("src");
    const imageAlt = originalImg.getAttribute("alt") || title;
    const scorePct = Math.round(Math.max(0, Math.min(100, rating * 10)));

    card.innerHTML = `
      <div class="cardInner">
        <div class="cardFront">
          <div class="netflixCardImg">
            <img src="${imageSrc}" alt="${imageAlt}" loading="lazy">
            <div class="posterShade"></div>
          </div>
          <div class="netflixCardRating"
               style="--score: ${scorePct};"
               data-score="${rating.toFixed(1)}">
            <span>${getRatingLabel(rating)}</span>
          </div>
        </div>

        <div class="cardBack">
          <p class="backEyebrow">${platform}</p>
          <h3>${title}</h3>
          <p class="backDescription">${description}</p>

          <div class="cardMeta">
            <span class="metaChip metaChip-platform">${platform}</span>
            <span>${genre}</span>
            <span>${getRatingLabel(rating)}</span>
            <!-- removed: <span>${rating.toFixed(1)} / 10</span> -->
          </div>

          <div class="backRating" style="--score: ${scorePct};">
            <strong>${rating.toFixed(1)}</strong>
            <small>/10</small>
          </div>

          <p class="tapHint">Tap again to flip back</p>
        </div>
      </div>
    `;

    card.addEventListener("click", () => {
      card.classList.toggle("is-flipped");
    });
  });

  function getRatingLabel(score) {
    if (score >= 9.5) return "Legendary";
    if (score >= 9)   return "Masterpiece";
    if (score >= 8)   return "Excellent";
    if (score >= 7)   return "Good";
    if (score >= 5)   return "Average";
    return "Low Rated";
  }

  // Filters + search (All Movies / All Shows only)
  (function () {
    const body = document.body;
    const isAllPage =
      body.id === "Movies-body" || body.id === "shows_BODY";
    if (!isAllPage) return;

    const cards = Array.from(document.querySelectorAll("#allGrid .netflixCard"));
    const searchInput = document.getElementById("allSearch");
    const filterButtons = Array.from(document.querySelectorAll(".allFilter"));

    let activePlatform = "all";
    let searchTerm = "";

    function normalize(str) {
      return (str || "").toLowerCase().trim();
    }

    function applyFilters() {
      const term = normalize(searchTerm);

      cards.forEach(card => {
        const platform = card.dataset.platform || "";
        const title = card.dataset.title || "";

        const platformMatch =
          activePlatform === "all" || platform === activePlatform;

        const searchMatch =
          !term || normalize(title).includes(term);

        const visible = platformMatch && searchMatch;

        // Hide the outer wrapper <div> that contains badge + card
        const wrapper = card.parentElement; 
        if (wrapper) {
          wrapper.classList.toggle("is-hidden", !visible);
        }
      });
    }

    // Filter buttons
    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const val = btn.getAttribute("data-filter") || "all";
        activePlatform = val;

        filterButtons.forEach(b => b.classList.remove("allFilter-active"));
        btn.classList.add("allFilter-active");

        applyFilters();
      });
    });

    // Live search
    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        searchTerm = e.target.value || "";
        applyFilters();
      });
    }
  })();
</script>
