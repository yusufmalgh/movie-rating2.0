<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple TV Movies</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body id="appleTvBody" data-accent="apple">

    <div id="appleTvHeader">
        <a href="index.html">
            <img class="appleTvHeaderIcon" src="Assets/home.png" alt="Home">
        </a>
        <a href="NETFLIX shows.html">
            <img class="appleTvHeaderIcon" src="Assets/Netflixs.png" alt="Netflix">
        </a>
        <a href="Crunchyroll shows.html">
            <img class="appleTvHeaderIcon" src="Assets/crunchyroll.png" alt="Crunchyroll">
        </a>
        <a href="PRIME shows.html">
            <img class="appleTvHeaderIcon" src="Assets/prime video.webp" alt="Prime Video">
        </a>
        <a>
            <img id="appleIconApple" class="appleTvHeaderIcon appleTvMain" src="Assets/apple tv.png" alt="Apple TV">
        </a>
        <a href="OSN shows.html">
            <img class="appleTvHeaderIcon" src="Assets/osn.jpg" alt="OSN">
        </a>
        <a href="Cinema.html">
            <img class="appleTvHeaderIcon" src="Assets/cinema.jpg" alt="Cinema">
        </a>
        <a href="Others Shows.html">
            <img class="appleTvHeaderIcon" src="Assets/others.png" alt="Others">
        </a>
    </div>

    <main class="appleTvPage">

        <section class="appleTvHero">
            <p class="appleTvEyebrow">Your personal Apple TV collection</p>
            <h1>Apple TV<br>Movies</h1>
            <p>Browse your rated Apple TV movies by genre. Click any poster to flip the card and reveal more details.</p>
        </section>

        <div id="appleTvSwitch">
            <a class="appleTvSwitchInactive" href="APPLE TV shows.html">Shows</a>
            <a class="appleTvSwitchActive" href="APPLE TV movies.html">Movies</a>
        </div>

        <!-- DRAMA -->
        <section id="appleTvDrama" class="appleTvSection">
            <div class="sectionHeader">
                <h2 class="appleTvSectionTitle">Drama</h2>
                <span>Emotional stories</span>
            </div>
            <div class="appleTvGrid">
                <div class="netflixCard"
                     data-title="Palmer"
                     data-genre="Drama"
                     data-rating="8.3"
                     data-description="A former football star bonds with an outcast young boy.">
                    <img src="Apple tv asset/palmer.jpg" alt="Palmer">
                </div>
            </div>
        </section>

        <!-- THRILLER -->
        <section id="appleTvThriller" class="appleTvSection">
            <div class="sectionHeader">
                <h2 class="appleTvSectionTitle">Thriller</h2>
                <span>Suspense picks</span>
            </div>
            <div class="appleTvGrid">
                <div class="netflixCard"
                     data-title="The Gorge"
                     data-genre="Thriller"
                     data-rating="9.1"
                     data-description="Two operatives guarding a gorge uncover a deadly hidden secret.">
                    <img src="Apple tv asset/thegorge.jpg" alt="The Gorge">
                </div>
            </div>
        </section>

    </main>

    <div id="appleTvFooter">© 2025 Your Ratings</div>

<script>
  (function () {
    const body = document.body;

    /* ================================
       1) APPLY SAVED THEME
    ================================ */
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "light" || savedTheme === "dark") {
      body.setAttribute("data-theme", savedTheme);
    } else {
      const prefersDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      body.setAttribute("data-theme", prefersDark ? "dark" : "light");
    }

    /* ================================
       2) PAGE PLATFORM DETECTION
    ================================ */
    const pagePlatformMap = {
      netflixBody: "Netflix",
      primeBody: "Prime Video",
      appleTvBody: "Apple TV",
      osnBody: "OSN",
      crunchyrollBody: "Crunchyroll",
      cenimaBody: "Cinema",
      othersBody: "Others"
    };

    const pagePlatform = pagePlatformMap[body.id] || null;
    const isMoviesPage = body.id === "Movies-body";
    const isShowsPage = body.id === "shows_BODY";
    const isMixedPage = isMoviesPage || isShowsPage;

    /* ================================
       3) BUILD FLIP CARDS
    ================================ */
    document.querySelectorAll(".netflixCard").forEach((card) => {
      const originalImg = card.querySelector("img");
      if (!originalImg) return;

      const title =
        card.dataset.title ||
        (isMoviesPage ? "Movie" : "Show");

      const genre =
        card.dataset.genre ||
        (isMoviesPage ? "Movie" : "Show");

      const ratingRaw = Number(card.dataset.rating || 0);
      const rating = Math.max(0, Math.min(10, ratingRaw));

      const description =
        card.dataset.description ||
        (isMoviesPage
          ? "A selected movie from your personal ratings collection."
          : "A selected show from your personal ratings collection.");

      const platform =
        card.dataset.platform ||
        pagePlatform ||
        "Mixed Platforms";

      const imageSrc = originalImg.getAttribute("src");
      const imageAlt = originalImg.getAttribute("alt") || title;
      const scorePct = Math.round(rating * 10);

      card.dataset.platform = platform;

      card.innerHTML = `
        <div class="cardInner">
          <div class="cardFront">
            <div class="netflixCardImg">
              <img src="${imageSrc}" alt="${imageAlt}" loading="lazy">
              <div class="posterShade"></div>
            </div>

            <div
              class="netflixCardRating"
              style="--score: ${scorePct};"
              data-score="${rating.toFixed(1)}"
            >
              <span>${getRatingLabel(rating)}</span>
            </div>
          </div>

          <div class="cardBack">
            <p class="backEyebrow">${platform}</p>

            <h3>${title}</h3>

            <p class="backDescription">${description}</p>

            <div class="cardMeta">
              <span class="metaChip metaChip-platform">${platform}</span>
              <span>${genre}</span>
              <span>${getRatingLabel(rating)}</span>
            </div>

            <div class="backRating" style="--score: ${scorePct};">
              <strong>${rating.toFixed(1)}</strong>
              <small>/10</small>
            </div>

            <p class="tapHint">Tap again to flip back</p>
          </div>
        </div>
      `;

      card.addEventListener("click", () => {
        card.classList.toggle("is-flipped");
      });
    });

    function getRatingLabel(score) {
      if (score >= 9.5) return "Legendary";
      if (score >= 9) return "Masterpiece";
      if (score >= 8) return "Excellent";
      if (score >= 7) return "Good";
      if (score >= 5) return "Average";
      return "Low Rated";
    }
  })();
</script>

</body>
</html>
