<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Movies</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body id="primeBody" data-accent="prime">

    <!-- HEADER -->
    <div id="primeHeader">
        <a href="index.html">
            <img class="primeHeaderIcon" src="Assets/home.png" alt="Home">
        </a>

        <a href="NETFLIX shows.html">
            <img class="primeHeaderIcon" src="Assets/Netflixs.png" alt="Netflix">
        </a>

        <a href="Crunchyroll shows.html">
            <img class="primeHeaderIcon" src="Assets/crunchyroll.png" alt="Crunchyroll">
        </a>

        <!-- Active Prime icon -->
        <a>
            <img id="primeicon" class="primeHeaderIcon" src="Assets/prime video.webp" alt="Prime Video">
        </a>

        <a href="APPLE TV shows.html">
            <img class="primeHeaderIcon" src="Assets/apple tv.png" alt="Apple TV">
        </a>

        <a href="OSN shows.html">
            <img class="primeHeaderIcon" src="Assets/osn.jpg" alt="OSN">
        </a>

        <a href="Cinema.html">
            <img class="primeHeaderIcon" src="Assets/cinema.jpg" alt="Cinema">
        </a>

        <a href="Others Shows.html">
            <img class="othersHeaderIcon" src="Assets/others.png" alt="Others">
        </a>
    </div>

    <main class="primePage">

        <!-- HERO -->
        <section class="primeHero">
            <p class="primeEyebrow">Your personal Prime Video collection</p>
            <h1>Prime Movies</h1>
            <p>
                Browse your rated Prime movies by genre. Click any poster to flip the card and reveal more details.
            </p>
        </section>

        <!-- SWITCH -->
        <div id="primeSwitch">
            <a class="primeSwitchInactive" href="PRIME shows.html">Series</a>
            <a class="primeSwitchActive" href="PRIME movies.html">Movies</a>
        </div>

        <!-- THRILLER -->
        <section id="primeThriller" class="primeSection">
            <div class="sectionHeader">
                <h2 class="primeSectionTitle">Thriller</h2>
                <span>Suspenseful favorites</span>
            </div>

            <div class="netflixGrid">
                <div class="netflixCard"
                     data-title="Disturbia"
                     data-genre="Thriller"
                     data-rating="8.5"
                     data-description="A teen under house arrest suspects his neighbor hides something deadly.">
                    <img src="Prime tv assets/disturbia.jpg" alt="Disturbia">
                </div>

                <div class="netflixCard"
                     data-title="The Lie"
                     data-genre="Psychological Thriller"
                     data-rating="8.8"
                     data-description="A shocking lie to protect their daughter destroys a family.">
                    <img src="Prime tv assets/thelie.jpg" alt="The Lie">
                </div>
            </div>
        </section>

        <!-- ACTION -->
        <section id="primeAction" class="primeSection">
            <div class="sectionHeader">
                <h2 class="primeSectionTitle">Action</h2>
                <span>High‑stakes survival</span>
            </div>

            <div class="netflixGrid">
                <div class="netflixCard"
                     data-title="Apocalypse Z"
                     data-genre="Action Horror"
                     data-rating="7.3"
                     data-description="Survivors battle to stay alive during a devastating zombie outbreak.">
                    <img src="Prime tv assets/apocalypse z.jpg" alt="Apocalypse Z">
                </div>
            </div>
        </section>

        <!-- HORROR -->
        <section id="primeHorror" class="primeSection">
            <div class="sectionHeader">
                <h2 class="primeSectionTitle">Horror</h2>
                <span>Nightmare fuel</span>
            </div>

            <div class="netflixGrid">
                <div class="netflixCard"
                     data-title="Goodnight Mommy"
                     data-genre="Horror"
                     data-rating="7.0"
                     data-description="Twin brothers fear the woman home might not be mother.">
                    <img src="Prime tv assets/goodnightmommy.jpg" alt="Goodnight Mommy">
                </div>
            </div>
        </section>

    </main>

    <div id="primeFooter">© 2025 Your Ratings</div>

    <!-- Flip logic reused from Netflix Series page -->
  <script>
  (function () {
    const body = document.body;

    /* ================================
       1) APPLY SAVED THEME
    ================================ */
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "light" || savedTheme === "dark") {
      body.setAttribute("data-theme", savedTheme);
    } else {
      const prefersDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      body.setAttribute("data-theme", prefersDark ? "dark" : "light");
    }

    /* ================================
       2) PAGE PLATFORM DETECTION
    ================================ */
    const pagePlatformMap = {
      netflixBody: "Netflix",
      primeBody: "Prime Video",
      appleTvBody: "Apple TV",
      osnBody: "OSN",
      crunchyrollBody: "Crunchyroll",
      cenimaBody: "Cinema",
      othersBody: "Others"
    };

    const pagePlatform = pagePlatformMap[body.id] || null;
    const isMoviesPage = body.id === "Movies-body";
    const isShowsPage = body.id === "shows_BODY";
    const isMixedPage = isMoviesPage || isShowsPage;

    /* ================================
       3) BUILD FLIP CARDS
    ================================ */
    document.querySelectorAll(".netflixCard").forEach((card) => {
      const originalImg = card.querySelector("img");
      if (!originalImg) return;

      const title =
        card.dataset.title ||
        (isMoviesPage ? "Movie" : "Show");

      const genre =
        card.dataset.genre ||
        (isMoviesPage ? "Movie" : "Show");

      const ratingRaw = Number(card.dataset.rating || 0);
      const rating = Math.max(0, Math.min(10, ratingRaw));

      const description =
        card.dataset.description ||
        (isMoviesPage
          ? "A selected movie from your personal ratings collection."
          : "A selected show from your personal ratings collection.");

      const platform =
        card.dataset.platform ||
        pagePlatform ||
        "Mixed Platforms";

      const imageSrc = originalImg.getAttribute("src");
      const imageAlt = originalImg.getAttribute("alt") || title;
      const scorePct = Math.round(rating * 10);

      card.dataset.platform = platform;

      card.innerHTML = `
        <div class="cardInner">
          <div class="cardFront">
            <div class="netflixCardImg">
              <img src="${imageSrc}" alt="${imageAlt}" loading="lazy">
              <div class="posterShade"></div>
            </div>

            <div
              class="netflixCardRating"
              style="--score: ${scorePct};"
              data-score="${rating.toFixed(1)}"
            >
              <span>${getRatingLabel(rating)}</span>
            </div>
          </div>

          <div class="cardBack">
            <p class="backEyebrow">${platform}</p>

            <h3>${title}</h3>

            <p class="backDescription">${description}</p>

            <div class="cardMeta">
              <span class="metaChip metaChip-platform">${platform}</span>
              <span>${genre}</span>
              <span>${getRatingLabel(rating)}</span>
            </div>

            <div class="backRating" style="--score: ${scorePct};">
              <strong>${rating.toFixed(1)}</strong>
              <small>/10</small>
            </div>

            <p class="tapHint">Tap again to flip back</p>
          </div>
        </div>
      `;

      card.addEventListener("click", () => {
        card.classList.toggle("is-flipped");
      });
    });

    function getRatingLabel(score) {
      if (score >= 9.5) return "Legendary";
      if (score >= 9) return "Masterpiece";
      if (score >= 8) return "Excellent";
      if (score >= 7) return "Good";
      if (score >= 5) return "Average";
      return "Low Rated";
    }
  })();
</script>

</body>
</html>
