<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watchlist</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>

<body id="Watchlist-body">

<header>
  <nav class="header-nav" aria-label="Main header">
    <a href="index.html" class="close-button" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </a>
    <h1 class="header-title">Watchlist</h1>
  </nav>
</header>

<section id="allControls" class="allControls">
  <div class="allControls-left">
    <input
      id="allSearch"
      type="search"
      placeholder="Search watchlist…"
      autocomplete="off"
    />
  </div>
  <div class="allControls-right">
    <button class="allFilter allFilter-active" data-filter="all">All</button>
    <button class="allFilter" data-filter="Netflix">Netflix</button>
    <button class="allFilter" data-filter="Prime Video">Prime</button>
    <button class="allFilter" data-filter="OSN">OSN</button>
    <button class="allFilter" data-filter="Apple TV">Apple TV</button>
    <button class="allFilter" data-filter="Crunchyroll">Crunchyroll</button>
    <button class="allFilter" data-filter="Cinema">Cinema</button>
    <button class="allFilter" data-filter="Others">Others</button>
  </div>
</section>

<div id="allGrid">
  <!-- You can start by manually adding watchlist cards here,
       or later generate them from a shared data.js file. -->
</div>

<!-- Reuse the same script you use on All Movies / All Shows,
     or a simplified version that just builds cards from HTML. -->
<script>
  // Simple flip builder for Watchlist page
  document.querySelectorAll(".netflixCard").forEach(card => {
    const originalImg = card.querySelector("img");
    if (!originalImg) return;

    const title       = card.dataset.title       || "Title";
    const genre       = card.dataset.genre       || "Title";
    const ratingRaw   = Number(card.dataset.rating || 0);
    const rating      = Math.max(0, Math.min(10, ratingRaw));
    const description = card.dataset.description ||
      "A selected title from your personal watchlist.";
    const platform    = card.dataset.platform    || "Mixed Platforms";

    const imageSrc = originalImg.getAttribute("src");
    const imageAlt = originalImg.getAttribute("alt") || title;
    const scorePct = Math.round(Math.max(0, Math.min(100, rating * 10)));

    card.innerHTML = `
      <div class="cardInner">
        <div class="cardFront">
          <div class="netflixCardImg">
            <img src="${imageSrc}" alt="${imageAlt}" loading="lazy">
            <div class="posterShade"></div>
          </div>
          <div class="netflixCardRating"
               style="--score: ${scorePct};"
               data-score="${rating.toFixed(1)}">
            <span>${getRatingLabel(rating)}</span>
          </div>
        </div>

        <div class="cardBack">
          <p class="backEyebrow">${platform}</p>
          <h3>${title}</h3>
          <p class="backDescription">${description}</p>

          <div class="cardMeta">
            <span class="metaChip metaChip-platform">${platform}</span>
            <span>${genre}</span>
            <span>${getRatingLabel(rating)}</span>
            <span>${rating.toFixed(1)} / 10</span>
          </div>

          <div class="backRating" style="--score: ${scorePct};">
            <strong>${rating.toFixed(1)}</strong>
            <small>/10</small>
          </div>

          <p class="tapHint">Tap again to flip back</p>
        </div>
      </div>
    `;

    card.addEventListener("click", () => {
      card.classList.toggle("is-flipped");
    });
  });

  function getRatingLabel(score) {
    if (score >= 9.5) return "Legendary";
    if (score >= 9)   return "Masterpiece";
    if (score >= 8)   return "Excellent";
    if (score >= 7)   return "Good";
    if (score >= 5)   return "Average";
    return "Low Rated";
  }
</script>

</body>
</html>
