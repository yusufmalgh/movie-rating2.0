<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Others Shows</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body id="othersBody">

    <!-- HEADER -->
    <div id="othersHeader">
        <a href="index.html">
            <img class="othersHeaderIcon" src="Assets/home.png" alt="Home">
        </a>

        <a href="NETFLIX shows.html">
            <img class="othersHeaderIcon" src="Assets/Netflixs.png" alt="Netflix">
        </a>

        <a href="Crunchyroll shows.html">
            <img class="othersHeaderIcon" src="Assets/crunchyroll.png" alt="Crunchyroll">
        </a>

        <a href="PRIME shows.html">
            <img class="othersHeaderIcon" src="Assets/prime video.webp" alt="Prime Video">
        </a>

        <a href="APPLE TV shows.html">
            <img class="othersHeaderIcon" src="Assets/apple tv.png" alt="Apple TV">
        </a>

        <a href="OSN shows.html">
            <img class="othersHeaderIcon" src="Assets/osn.jpg" alt="OSN">
        </a>

        <a href="Cinema.html">
            <img class="othersHeaderIcon" src="Assets/cinema.jpg" alt="Cinema">
        </a>

        <!-- Active Others icon -->
        <a>
            <img id="othersIconOthers" class="othersHeaderIcon" src="Assets/others.png" alt="Others">
        </a>
    </div>

    <main class="othersPage">

        <!-- HERO -->
        <section class="othersHero">
            <p class="othersEyebrow">Your personal mixed‑platform collection</p>
            <h1>Other Shows</h1>
            <p>
                Browse your rated shows from other platforms. Click any poster to flip the card and reveal more details.
            </p>
        </section>

        <!-- SWITCH -->
        <div id="othersSwitch">
            <a id="othersShowBtn" class="othersSwitchActive" href="Others shows.html">Show</a>
            <a id="othersMoviesBtn" class="othersSwitchInactive" href="Others movies.html">Movies</a>
        </div>

        <!-- DRAMA -->
        <section id="othersDrama" class="othersSection">
            <div class="sectionHeader">
                <h2 class="othersSectionTitle">Drama</h2>
                <span>Intense character stories</span>
            </div>

            <div class="netflixGrid">
                <div class="netflixCard"
                     data-title="Dexter: Resurrection"
                     data-genre="Crime Drama"
                     data-rating="9.5"
                     data-description="Dexter returns to confront new dangers while facing the consequences of his past.">
                    <img src="Others assets/dexterresurruction.jpg" alt="Dexter: Resurrection">
                </div>

               

                <div class="netflixCard"
                     data-title="Dexter: New Blood"
                     data-genre="Crime Drama"
                     data-rating="9.2"
                     data-description="Years after disappearing, Dexter builds a new life—but his dark passenger is never far away.">
                    <img src="Others assets/dexternewblood.jpg" alt="Dexter: New Blood">
                </div>

                <div class="netflixCard"
                     data-title="Mouse"
                     data-genre="K‑Drama Thriller"
                     data-rating="9.1"
                     data-description="A psychological thriller about nature, nurture, and the mind of a killer.">
                    <img src="Others assets/mouse.jpg" alt="Mouse">
                </div>
            </div>
        </section>

        <!-- ANIME -->
        <section id="othersAnime" class="othersSection">
            <div class="sectionHeader">
                <h2 class="othersSectionTitle">Anime</h2>
                <span>Stand‑out picks</span>
            </div>

            <div class="netflixGrid">
                <div class="netflixCard"
                     data-title="Tokyo Ghoul"
                     data-genre="Anime Horror"
                     data-rating="8.9"
                     data-description="A college student becomes half‑ghoul and must survive in a dangerous hidden world.">
                    <img src="Others assets/tokyoghoul.jpg" alt="Tokyo Ghoul">
                </div>
            </div>
        </section>

    </main>

    <div id="othersFooter">© 2025 Your Ratings</div>

    <!-- Flip logic reused from Netflix Series page -->
<script>
  (function () {
    const body = document.body;

    /* ================================
       1) APPLY SAVED THEME
    ================================ */
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "light" || savedTheme === "dark") {
      body.setAttribute("data-theme", savedTheme);
    } else {
      const prefersDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      body.setAttribute("data-theme", prefersDark ? "dark" : "light");
    }

    /* ================================
       2) PAGE PLATFORM DETECTION
    ================================ */
    const pagePlatformMap = {
      netflixBody: "Netflix",
      primeBody: "Prime Video",
      appleTvBody: "Apple TV",
      osnBody: "OSN",
      crunchyrollBody: "Crunchyroll",
      cenimaBody: "Cinema",
      othersBody: "Others"
    };

    const pagePlatform = pagePlatformMap[body.id] || null;
    const isMoviesPage = body.id === "Movies-body";
    const isShowsPage = body.id === "shows_BODY";
    const isMixedPage = isMoviesPage || isShowsPage;

    /* ================================
       3) BUILD FLIP CARDS
    ================================ */
    document.querySelectorAll(".netflixCard").forEach((card) => {
      const originalImg = card.querySelector("img");
      if (!originalImg) return;

      const title =
        card.dataset.title ||
        (isMoviesPage ? "Movie" : "Show");

      const genre =
        card.dataset.genre ||
        (isMoviesPage ? "Movie" : "Show");

      const ratingRaw = Number(card.dataset.rating || 0);
      const rating = Math.max(0, Math.min(10, ratingRaw));

      const description =
        card.dataset.description ||
        (isMoviesPage
          ? "A selected movie from your personal ratings collection."
          : "A selected show from your personal ratings collection.");

      const platform =
        card.dataset.platform ||
        pagePlatform ||
        "Mixed Platforms";

      const imageSrc = originalImg.getAttribute("src");
      const imageAlt = originalImg.getAttribute("alt") || title;
      const scorePct = Math.round(rating * 10);

      card.dataset.platform = platform;

      card.innerHTML = `
        <div class="cardInner">
          <div class="cardFront">
            <div class="netflixCardImg">
              <img src="${imageSrc}" alt="${imageAlt}" loading="lazy">
              <div class="posterShade"></div>
            </div>

            <div
              class="netflixCardRating"
              style="--score: ${scorePct};"
              data-score="${rating.toFixed(1)}"
            >
              <span>${getRatingLabel(rating)}</span>
            </div>
          </div>

          <div class="cardBack">
            <p class="backEyebrow">${platform}</p>

            <h3>${title}</h3>

            <p class="backDescription">${description}</p>

            <div class="cardMeta">
              <span class="metaChip metaChip-platform">${platform}</span>
              <span>${genre}</span>
              <span>${getRatingLabel(rating)}</span>
            </div>

            <div class="backRating" style="--score: ${scorePct};">
              <strong>${rating.toFixed(1)}</strong>
              <small>/10</small>
            </div>

            <p class="tapHint">Tap again to flip back</p>
          </div>
        </div>
      `;

      card.addEventListener("click", () => {
        card.classList.toggle("is-flipped");
      });
    });

    function getRatingLabel(score) {
      if (score >= 9.5) return "Legendary";
      if (score >= 9) return "Masterpiece";
      if (score >= 8) return "Excellent";
      if (score >= 7) return "Good";
      if (score >= 5) return "Average";
      return "Low Rated";
    }
  })();
</script>

</body>
</html>
